[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hs-cad"
version = "0.2.0"
description = "Safe ZWCAD 2024-2026 architectural drawing analysis and automation toolkit"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "Proprietary"}
authors = [{name = "HS-CAD"}]
dependencies = [
  "comtypes>=1.4.8; platform_system == 'Windows'",
  "pywin32>=306; platform_system == 'Windows'",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
  "pandas>=2.1,<3",
  "openpyxl>=3.1,<4",
  "ezdxf>=1.3,<2",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10.3,<12",
  "PyYAML>=6.0,<7",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "networkx>=3.2,<4",
  "duckdb>=1.1,<2",
  "shapely>=2.0,<3",
  "requests>=2.32,<3",
  "mss>=9,<11"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "build>=1.2,<2"
]
build = [
  "pyinstaller>=6.10,<7"
]
ocr = [
  "paddleocr>=2.9,<4",
  "easyocr>=1.7,<2"
]

[project.scripts]
hscad = "src.main:main"
hs-cad = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "windows: requires Windows",
  "zwcad: requires an installed/running ZWCAD instance",
  "integration: external-system integration test"
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["_*/", "outputs/", "build/", "dist/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
