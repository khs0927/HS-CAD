# Architectural layer taxonomy used by src/semantics.
# Priority: layer rule -> entity type/geometry -> block/text hints -> optional screen capture.
classification_priority:
  - layer
  - entity_type_geometry
  - block_name_text
  - screen_capture_support_only
layers:
  COL:
    meaning: [structure, concrete_column, concrete_wall, steel_wall, steel_beam, other_structural_member]
    semantic_type: structural_member
    category: structure
    structural_role: structural
    discipline: structure
    is_structural: true
    output: true
    risk: high
    confidence: 0.98
  WAL1:
    meaning: [nonstructural_wall, white_layer, lightweight_wall]
    semantic_type: nonstructural_wall
    subtype: lightweight_wall
    category: wall
    structural_role: nonstructural
    recommended_color: 7
    is_structural: false
    output: true
    risk: medium
    confidence: 0.98
  WAL2:
    meaning: [nonstructural_wall, green_layer, masonry_wall]
    semantic_type: nonstructural_wall
    subtype: masonry_wall
    category: wall
    structural_role: nonstructural
    recommended_color: 3
    is_structural: false
    output: true
    risk: medium
    confidence: 0.98
  WAL3:
    meaning: [nonstructural_wall, other_wall]
    semantic_type: nonstructural_wall
    subtype: other_wall
    category: wall
    structural_role: nonstructural
    is_structural: false
    output: true
    risk: medium
    confidence: 0.96
  WAL4_PLUS:
    pattern: "^WAL[4-9][0-9]*$"
    meaning: [nonstructural_wall, detailed_wall_variant]
    semantic_type: nonstructural_wall
    subtype: wall_variant
    category: wall
    structural_role: nonstructural
    is_structural: false
    output: true
    risk: medium
    confidence: 0.86
