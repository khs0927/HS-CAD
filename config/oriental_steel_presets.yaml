# Oriental Factory Steel Structure & Panel Presets
# Captured from: 건축도면 [오리엔탈 공장]_0115(개요수정).dwg
# Standard: 지음건축 (Jieum Architects) S조 설계 문법

structure_type: "SteelStructure"
project_reference: "OrientalFactory"
jieum_standards: true

# 단열재 코어 분류별 법정 표준 두께 스펙
insulation_panels:
  glasswool:
    roof:
      thickness: 180
      specification: "T180 그라스울 판넬(지붕)"
      thermal_classification: "가등급"
      layer: "TXT"
    wall:
      thickness: 100
      specification: "T100 그라스울 벽판넬"
      siding_specification: "T100 그라스울 사이딩판넬"
      layer: "TXT"
  eps:
    roof:
      thickness: 225
      specification: "THK225 EPS(준불연)(0.040W/㎡K) 판넬(지붕)"
      layer: "@text"
    wall:
      thickness: 125
      specification: "THK125 EPS(준불연)(0.040W/㎡K) 1000골판넬(벽)"
      siding_specification: "THK125 EPS(준불연)(0.040W/㎡K) 사이딩판넬(메탈 홑강판)"
      hanger_door_specification: "THK125 EPS(준불연)(0.040W/㎡K) 행거도어"
      layer: "@text"

# 표준 H형강 및 C형강 규격 스펙 목록 (평면/단면 설계 자동치수 바인딩용)
structural_steel_members:
  columns:
    main_column:
      profile: "H-400x200x8x13"
      height: 400
      width: 200
      web_thickness: 8
      flange_thickness: 13
      layer: "COL"
      color_index: 2 # Yellow
      fireproofing:
        material: "내화뿜칠"
        thickness: 20
        casing_casing: "T12.5 석고보드 2PLY"
    sub_column:
      profile: "H-300x300x10x15"
      height: 300
      width: 300
      web_thickness: 10
      flange_thickness: 15
      layer: "COL"
      color_index: 2
  beams:
    main_rafter:
      profile: "H-400x200x8x13"
      height: 400
      width: 200
      web_thickness: 8
      flange_thickness: 13
      layer: "COL"
      color_index: 2
      slope_pitch: "1:10" # Rafter standard gabled roof pitch (10%)
    sub_beam:
      profile: "H-300x150x6.5x9"
      height: 300
      width: 150
      web_thickness: 6.5
      flange_thickness: 9
      layer: "COL"
      color_index: 2
  purlins:
    roof_purlin:
      profile: "C-150x65x20x2.3"
      height: 150
      width: 65
      lip: 20
      thickness: 2.3
      spacing: 700 # 700mm pitch centers
      layer: "COL"
      color_index: 2
  girts:
    wall_girt:
      profile: "C-100x50x20x2.3"
      height: 100
      width: 50
      lip: 20
      thickness: 2.3
      layer: "COL"
      color_index: 2

glazing:
  double_glass_gray:
    thickness: 24
    glass_formulation: "T5 반사유리 + T14 공기층 + T5 Gray 유리"
    specification: "THK24 Gray 복층유리 (T5 반사유리 + T14 공기층 + T5 Gray 유리)"
    layer: "textex"
  tempered_glass:
    thickness: 12
    specification: "THK12 강화유리"
    layer: "textex"
  frame_steel:
    thickness_gauge: 1.2
    specification: "THK1.2 SST. FRAME"
    layer: "textex"
  frame_aluminum:
    thickness_gauge: 200
    specification: "THK200 AL.FRAME"
    layer: "textex"

ceilings:
  acoustic_tex:
    thickness: 12
    specification: "THK12 아쿠스틱 텍스"
    grid_system: "아연도강판 천정틀 (T-BAR)"
    layer: "AZ-TEXT"
  clip_bar_system:
    grid_system: "아연도강판 천정틀 (CLIP-BAR)"
    layer: "AZ-TEXT"

partitions:
  gypsum_stud:
    total_thickness: 103
    gypsum_thickness: 9.5
    gypsum_layers: "2PLY"
    stud_thickness: 65
    specification: "THK9.5 석고보드 2PLY + THK65 STUD"
    layer: "TXT"

foundations:
  rc_foundation_300:
    thickness: 300
    specification: "THK300 철골 CON'C 기초"
    layer: "TXT"
  rc_foundation_600:
    thickness: 600
    specification: "THK600 철골 CON'C 기초"
    layer: "TXT"
  slab_under:
    thickness: 150
    concrete_specification: "THK150 밑창 콘크리트"
    pe_film_specification: "THK0.03 PE필름 2겹"
    layer: "TXT"
  slab_insulation:
    thickness: 90
    specification: "THK90 단열재 (가등급 1호)"
    layer: "TXT"
