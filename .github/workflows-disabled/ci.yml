name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: CLI import smoke test
        run: python -m src.main --help

      - name: Environment doctor smoke test
        run: python -m src.main doctor

      - name: Run tests
        run: python -m pytest -q --disable-warnings --maxfail=1 --junitxml=test-results/junit.xml

      - name: xiCAD MCP stdio smoke (headless, no ZWCAD)
        run: python scripts/smoke_xicad_mcp_stdio.py

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-results/junit.xml
          if-no-files-found: warn
          retention-days: 7

  mobile-app:
    name: Mobile ChatGPT CAD app (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-cad-chatgpt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile-cad-chatgpt/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit (high and above)
        run: npm audit --audit-level=high

      - name: Validate (typecheck, vitest, bootstrap tests, build, bundle check)
        run: npm run validate
