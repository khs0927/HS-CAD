name: main-code-overlay-ci

on:
  pull_request:
  push:
    branches: [main, integration/main-merge-operator-review]

jobs:
  test-main-code-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install project
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" || pip install -e .
      - name: Ruff critical
        run: python -m ruff check . --select F821,E9,F63,F7,F82
      - name: Main-code overlay tests
        run: python -X utf8 -m pytest -q tests/test_main_code_overlay_contracts.py tests/test_main_code_pipeline_smoke.py
      - name: CLI smoke
        run: python -X utf8 -m hscad.pipelines.main_code_pipeline --input tests/fixtures/minimal_floorplan.dxf --out outputs/main_code_ci_smoke
