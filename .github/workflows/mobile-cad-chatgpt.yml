name: Mobile CAD ChatGPT App

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile-cad-chatgpt/**"
      - ".github/workflows/mobile-cad-chatgpt.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile-cad-chatgpt/**"
      - ".github/workflows/mobile-cad-chatgpt.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-cad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-cad-chatgpt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: apps/mobile-cad-chatgpt/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build and inspect bundle
        run: npm run build && npm run check:bundle

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: License and secret checks
        run: npm run security:local

      - name: Wrangler dry-run
        run: npm run check:worker
