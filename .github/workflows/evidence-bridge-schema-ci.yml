name: evidence-bridge-schema-ci

on:
  pull_request:
  push:
    branches:
      - feature/evidence-bridge-schema-golden

jobs:
  test-evidence-bridge-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install project
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" || pip install -e .
      - name: Ruff critical
        run: python -m ruff check . --select F821,E9,F63,F7,F82
      - name: Schema bridge tests
        run: python -X utf8 -m pytest -q tests/test_legacy_artifact_schema_v6.py
