name: Build Windows Release

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "installer/**"
      - "scripts/build_windows*"
      - "pyproject.toml"
      - ".github/workflows/build-windows-release.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix"
        required: false
        default: "0.2.0"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            if ("${{ github.ref_type }}" -eq "tag") {
              $version = "${{ github.ref_name }}".TrimStart("v")
            } elseif ("${{ github.event_name }}" -eq "pull_request") {
              $version = "0.2.0-pr.${{ github.event.pull_request.number }}"
            } else {
              $version = "0.2.0-ci.${{ github.run_number }}"
            }
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build, test, and package
        shell: pwsh
        run: ./scripts/build_windows_release.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Generate installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/HS-CAD-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Out-File "$($installer.FullName).sha256" -Encoding ascii

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: HS-CAD-Windows-${{ steps.version.outputs.version }}
          path: |
            dist/HS-CAD.exe
            dist/HS-CAD.exe.sha256
            dist/HS-CAD-Setup-*.exe
            dist/HS-CAD-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            dist/HS-CAD.exe `
            dist/HS-CAD.exe.sha256 `
            dist/HS-CAD-Setup-*.exe `
            dist/HS-CAD-Setup-*.exe.sha256 `
            --title "HS-CAD ${{ steps.version.outputs.version }}" `
            --generate-notes
