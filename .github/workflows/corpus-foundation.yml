name: Corpus Foundation

on:
  pull_request:
    paths:
      - 'src/adapters/ezdxf_corpus_scanner.py'
      - 'src/corpus/**'
      - 'src/corpus_run/**'
      - 'src/drawing_index/**'
      - 'src/fileizers/**'
      - 'src/app/corpus_cli.py'
      - 'config/*.env.example'
      - 'docs/24_free_only_runtime.md'
      - 'scripts/validate_free_only.py'
      - 'supabase/migrations/**'
      - 'tests/test_corpus_foundation.py'
      - 'tests/test_drawing_index_v2.py'
      - 'tests/test_drawing_index_architecture.py'
      - 'tests/test_supabase_summary_privacy.py'
      - 'tests/test_free_only_runtime.py'
      - 'pyproject.toml'
      - '.github/workflows/corpus-foundation.yml'
  push:
    branches:
      - agent/drawing-index-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus-foundation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile drawing index sources
        run: python -m compileall -q src/drawing_index src/adapters/ezdxf_corpus_scanner.py src/corpus src/corpus_run src/fileizers scripts tests

      - name: Validate free-only dependency policy
        run: python scripts/validate_free_only.py

      - name: Run drawing index tests
        run: >-
          python -m pytest -q --disable-warnings --maxfail=1
          tests/test_corpus_foundation.py
          tests/test_drawing_index_v2.py
          tests/test_drawing_index_architecture.py
          tests/test_supabase_summary_privacy.py
          tests/test_free_only_runtime.py

      - name: CLI help smoke test
        run: python -m src.main corpus-run complete --help
