name: Corpus Foundation

on:
  pull_request:
    paths:
      - 'src/corpus/**'
      - 'src/corpus_run/**'
      - 'src/fileizers/**'
      - 'src/app/corpus_cli.py'
      - 'tests/test_corpus_foundation.py'
      - 'requirements.txt'
      - '.github/workflows/corpus-foundation.yml'
  push:
    branches:
      - corpus-foundation

jobs:
  corpus-foundation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run corpus foundation tests
        run: python -m pytest tests/test_corpus_foundation.py

      - name: CLI help smoke test
        run: python -m src.main corpus-run --help
