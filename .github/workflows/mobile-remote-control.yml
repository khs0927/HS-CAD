name: Mobile Remote Control

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task to run from the GitHub mobile or web UI
        required: true
        default: doctor
        type: choice
        options:
          - doctor
          - python-tests
          - windows-package
          - mobile-cad-tests
          - all-safe-tests
      ref_note:
        description: Optional note identifying the requested test
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-remote-${{ github.ref }}-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  remote-control:
    name: ${{ inputs.task }} on Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout requested branch
        uses: actions/checkout@v4

      - name: Record request
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          @"
          task=${{ inputs.task }}
          ref=${{ github.ref }}
          sha=${{ github.sha }}
          note=${{ inputs.ref_note }}
          requested_at=$(Get-Date -Format o)
          "@ | Set-Content -Encoding utf8 test-results/mobile-request.txt

      - name: Set up Python 3.11
        if: inputs.task != 'mobile-cad-tests'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python project
        if: inputs.task != 'mobile-cad-tests'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run environment doctor
        if: inputs.task == 'doctor' || inputs.task == 'all-safe-tests'
        shell: pwsh
        run: python -m src.main doctor | Tee-Object -FilePath test-results/doctor.txt

      - name: Run Python tests
        if: inputs.task == 'python-tests' || inputs.task == 'all-safe-tests'
        shell: pwsh
        run: python -m pytest -q --disable-warnings --maxfail=1 --junitxml=test-results/junit.xml

      - name: Build Windows package
        if: inputs.task == 'windows-package'
        shell: pwsh
        run: ./scripts/build_windows_release.ps1

      - name: Detect mobile CAD app
        if: inputs.task == 'mobile-cad-tests' || inputs.task == 'all-safe-tests'
        id: mobile_app
        shell: pwsh
        run: |
          if (Test-Path 'apps/mobile-cad-chatgpt/package-lock.json') {
            "present=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "present=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            'Mobile CAD app is not present on this branch. Use PR #127 branch or merge it first.' |
              Set-Content -Encoding utf8 test-results/mobile-cad-skipped.txt
          }

      - name: Set up Node.js 22
        if: (inputs.task == 'mobile-cad-tests' || inputs.task == 'all-safe-tests') && steps.mobile_app.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile-cad-chatgpt/package-lock.json

      - name: Test mobile CAD app
        if: (inputs.task == 'mobile-cad-tests' || inputs.task == 'all-safe-tests') && steps.mobile_app.outputs.present == 'true'
        shell: pwsh
        run: |
          npm --prefix apps/mobile-cad-chatgpt ci
          npm --prefix apps/mobile-cad-chatgpt run typecheck
          npm --prefix apps/mobile-cad-chatgpt test
          npm --prefix apps/mobile-cad-chatgpt run build

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-remote-${{ inputs.task }}-${{ github.run_number }}
          path: |
            test-results/
            dist/
            build/
          if-no-files-found: warn
          retention-days: 7
